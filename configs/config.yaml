# VetVoice RAG Configuration
# --------------------------
# ЕДИНЫЙ источник конфигурации. Файл реально читается (src/settings.py),
# это не декорация.
#
# Приоритет: env VETVOICE_* → .env → этот файл → дефолты в src/settings.py.
# Примеры: VETVOICE_ZAI_BASE_URL, VETVOICE_LLM_MODEL, VETVOICE_API_KEYS,
#          VETVOICE_RAG_TOP_K, VETVOICE_KB_DIR.
#
# Knowledge base is built locally (scripts/build_rag.py) and loaded from
# `knowledge_base/` next to this repo. HF Hub is used as a fallback when
# local files are missing — репозиторий публичный, токен не обязателен.

api:
  host: "0.0.0.0"
  port: 7860
  # "*" допустимо для локальной разработки. В проде перечисли конкретные origins.
  cors_origins: ["*"]

rag:
  # Local KB dir — defaults to <repo>/knowledge_base if empty.
  # Override with env VETVOICE_KB_DIR for Docker/HF Spaces.
  local_dir: ""
  hf_dir: "/tmp/vet_rag"
  repo_id: "shrayyyy/vet-derm-rag"
  top_k: 5
  max_context_chars: 5000
  # Minimum similarity score (cosine, 0..1) for a chunk to be returned.
  min_score: 0.01

# Публичный endpoint Z AI.
# internal-api.z.ai резолвится в приватный IP (172.25.x.x) и недоступен
# ни с телефона, ни с HF Spaces, ни из Docker — не использовать.
zai:
  config_path: "/etc/.z-ai-config"
  base_url: "https://api.z.ai/api/paas/v4"
  models:
    vlm: "glm-4.6v"
    llm: "glm-4.5-flash"

logging:
  level: "INFO"
