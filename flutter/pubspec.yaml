name: veteco
description: "VetEco — ветеринарная экосистема: диктовка → медкарта, калькулятор дозировок, AI-RAG, VLM диагностика"
publish_to: 'none'
version: 1.1.2+4  # 1.1.2: release-подпись APK + versionCode теперь из pubspec

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # WebView (VetLearn)
  webview_flutter: ^4.8.0

  # Image picker (VLM)
  image_picker: ^1.1.1

  # Shared preferences
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/
