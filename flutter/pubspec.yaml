name: veteco
description: "VetEco — ветеринарная экосистема: диктовка → медкарта, калькулятор дозировок, AI-RAG, VLM диагностика"
publish_to: 'none'
version: 1.2.0+5  # 1.2.0: vet-ds v2.3.2 «Научная периодика» (голос A + бирюза) — lib/theme/ds.dart

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # WebView (VetLearn)
  webview_flutter: ^4.8.0

  # Image picker (VLM)
  image_picker: ^1.1.1

  # Shared preferences
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/

  # vet-ds v2.3.2: Prata — дисплей-заголовки (serif периодики, 99 КБ,
  # кириллица; прецедент VetOS Task 166). Текст — системный Roboto.
  fonts:
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata-Regular.ttf
          weight: 400
