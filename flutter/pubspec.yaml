name: veteco
description: "VetEco — ветеринарная экосистема: диктовка → медкарта, калькулятор дозировок, AI-RAG, VLM диагностика"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Speech
  # Pinned: speech_to_text 7.0.3 and flutter_tts 4.0.2 are the last versions
  # compiled against Kotlin 1.9.x. Newer versions (speech_to_text 7.1+,
  # flutter_tts 4.2.5) ship with Kotlin 2.2.0 metadata which fails to
  # compile with both Kotlin 1.9.24 AND Kotlin 2.1.0 — only works with
  # Kotlin 2.2.x which isn't yet supported by Flutter's gradle plugin.
  speech_to_text: 7.0.3
  flutter_tts: 4.0.2

  # HTTP
  http: ^1.2.1

  # WebView (VetLearn)
  webview_flutter: ^4.8.0

  # Image picker (VLM)
  image_picker: ^1.1.1

  # Path provider
  path_provider: ^2.1.3

  # Shared preferences
  shared_preferences: ^2.2.3

  # URL launcher
  url_launcher: ^6.3.0

  # Intl
  intl: ^0.19.0

  # Markdown rendering
  flutter_markdown: ^0.7.3+1

  # UUID
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # shared_preferences_android 2.4.10+ ships with Kotlin 2.2.0 metadata
  # which fails to compile with Kotlin 2.1.0 (max metadata version 2.0.0).
  # 2.4.9 is the last version compatible with Kotlin 1.9.x/2.1.0.
  shared_preferences_android: 2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/advanced/
