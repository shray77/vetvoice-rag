version: "3.9"

services:
  vetvoice-api:
    build: .
    container_name: vetvoice-api
    ports:
      - "7860:7860"
    env_file:
      # .env is optional — copy .env.example to .env and fill in.
      # `required: false` so `docker compose up` works without it.
      - path: .env
        required: false
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      - rag-cache:/tmp/vet_rag
    restart: unless-stopped
    healthcheck:
      # Gradio serves the UI at "/" — use it as the liveness signal.
      # (No `curl` in the slim image, so we use python's urllib.)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  rag-cache:
