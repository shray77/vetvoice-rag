[flake8]
max-line-length = 120
exclude =
    __pycache__,
    .git,
    .venv,
    venv,
    build,
    dist

# E501 — длина строки; в CI передаётся --ignore E501 отдельно.
# E203  — пробел перед ':' в срезах; конфликтует с black-форматированием.
# E402  — импорт не в начале файла: осознанно в eval-скриптах и src/rag/search.py,
#         где сначала делается sys.path.insert(ROOT), а затем импорт src.*.
extend-ignore =
    E501,
    E203,
    E402
