name: Flutter Build APK

on:
  push:
    branches: [main]
    paths: ['flutter/**', '.github/workflows/flutter-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for creating releases

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
            flutter/.flutter-plugins
            flutter/.flutter-plugins-dependencies
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Cache Gradle wrapper & build
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/.gradle
            flutter/android/build
            flutter/build
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/android/**/*.gradle', 'flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Create local.properties
        working-directory: flutter
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Analyze
        working-directory: flutter
        # Non-fatal: analyze but don't block the build on lint warnings
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release --shrink

      - name: Get version & short SHA
        id: version
        working-directory: flutter
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f2)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Tag includes short SHA so each push creates a unique release
          # (avoids "tag already exists" error on subsequent commits)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=VetEco ${VERSION} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK_DIR="flutter/build/app/outputs/flutter-apk"
          mv "${APK_DIR}/app-release.apk" \
             "${APK_DIR}/veteco-${{ steps.version.outputs.short_sha }}.apk"
          # Also keep a stable-named copy for direct download
          cp "${APK_DIR}/veteco-${{ steps.version.outputs.short_sha }}.apk" \
             "${APK_DIR}/veteco-latest.apk"

      - name: Upload APK artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: veteco-apk-${{ steps.version.outputs.short_sha }}
          path: flutter/build/app/outputs/flutter-apk/veteco-*.apk
          retention-days: 30

      - name: Generate install QR code
        # QR code points to the release download URL — scan from phone to install
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/veteco-${{ steps.version.outputs.short_sha }}.apk"
          # Use qrcode library via Python (pre-installed on ubuntu-latest)
          pip install --quiet qrcode[pil]
          python -c "
          import qrcode
          url = '${APK_URL}'
          qr = qrcode.QRCode(version=1, box_size=10, border=2, error_correction=qrcode.constants.ERROR_CORRECT_M)
          qr.add_data(url)
          qr.make(fit=True)
          img = qr.make_image(fill_color='black', back_color='white')
          img.save('install-qr.png')
          print(f'QR code generated → install-qr.png')
          print(f'URL: {url}')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## VetEco ${{ steps.version.outputs.version }} (`${{ steps.version.outputs.short_sha }}`)

            ### 📲 Установка на телефон
            **Отсканируйте QR-код** ниже камерой телефона → откроется прямая ссылка на APK:

            ![QR для установки](install-qr.png)

            Или скачайте `veteco-${{ steps.version.outputs.short_sha }}.apk` вручную.

            > ⚠️ На Android: «Настройки → Безопасность → Unknown sources» (или подтвердите при установке).

            ### 📦 Модули
            - 📝 **Записи** — голосовая диктовка → SOAP медкарта
            - 💊 **Дозы** — калькулятор дозировок (2 401 препарат)
            - 🤖 **AI** — RAG чат (12 024 чанков) + VLM диагностика (GLM-4.6V)
            - ⚙️ **Ещё** — VetLearn + Справочник + Настройки

            ### 🎨 Дизайн
            - **Vet Teal** (`#0D9488`) — Apple Health-inspired
            - Auto theme (light/dark)
            - Comfortable density, 4px spacing grid

            ### 📊 Базы данных
            - 2 449 препаратов в реестре + 2 401 для калькулятора
            - 169 болезней (139 инфекционных + 30 незаразных)
            - 154 протокола лечения
            - 73 взаимодействия, 17 антидотов, 16 экстренных протоколов
            - 19 побочных эффектов, 4 формулы жидкости, 83 периода ожидания

            ### 🔧 Технологии
            - **Backend**: FastAPI v2 + FAISS TF-IDF + hybrid retrieval (keyword boost + EN/RU translation)
            - **AI**: GLM-4-Flash + GLM-4.6V (Z AI gateway)
            - **3-tier fallback**: локальный FastAPI → HF Space → прямой GLM
            - **chatId TTL fix**: FastAPI перечитывает /etc/.z-ai-config каждые 30 сек
            - Flutter + Material 3

            ### 🔗 Ссылки
            - [Исходный код](${{ github.server_url }}/${{ github.repository }})
            - [Actions](${{ github.server_url }}/${{ github.repository }}/actions)
            - [Все релизы](${{ github.server_url }}/${{ github.repository }}/releases)

            ---
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: |
            flutter/build/app/outputs/flutter-apk/veteco-${{ steps.version.outputs.short_sha }}.apk
            install-qr.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
