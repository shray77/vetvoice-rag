name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ds-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DS-гейт v2 — ds.dart против design/tokens.json (дрейф ядра = красный)
        run: python3 scripts/ds_gate.py


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache pip linters
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            lint-${{ runner.os }}-pip-
      - name: Install linters
        run: pip install ruff flake8
      - name: Lint Python
        run: |
          ruff check src/ --ignore E501
          # Параметры flake8 (max-line-length/exclude/extend-ignore) живут в setup.cfg —
          # флаги в CLI переопределяют конфиг, поэтому здесь их не дублируем.
          flake8 src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache pip deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            test-${{ runner.os }}-pip-
      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-fail-under=30
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GLM_API_KEY: test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-buildx-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vetvoice-rag:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Test container starts
        run: docker run -d --name test vetvoice-rag:latest && sleep 5 && docker logs test && docker stop test


  db-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DB-гейт препаратов + сверка со справочником доз (Task 182)
        # Числовые базы (assets/data — канонический источник после синка
        # из vetvoice) против физио-пределов и кураторского
        # correct_dosages_reference.json (Plumb's).
        run: python3 scripts/validate_drug_db.py --reference assets/data/correct_dosages_reference.json

      - name: DB-гейт flutter-копии (Task 224: приложение читает flutter/assets)
        # Приложение грузит базы через rootBundle из flutter/assets/data —
        # раньше эта копия не валидировалась ВООБЩЕ и разъехалась с
        # каноном на 1012/2401 записей (фиксы доз Task 223 до приложения
        # не дошли). Теперь она под тем же гейтом, что и корневая.
        run: python3 scripts/validate_drug_db.py --data-dir flutter/assets/data --reference flutter/assets/data/correct_dosages_reference.json

      - name: Синк-гейт трёх копий базы (Task 224)
        # assets/data и flutter/assets/data обязаны совпадать байт-в-байт
        # с каноном vetvoice (RAW GitHub). Первый прогон может поймать
        # CDN-лаг raw после свежего пуша канона — потому одна повторная
        # попытка через минуту, и только потом красный.
        run: |
          if python3 scripts/sync_drugs_from_vetvoice.py --check; then
            exit 0
          fi
          echo "::warning::Первый прогон синк-гейта провален — ждём 60с (CDN-лаг raw) и повторяем"
          sleep 60
          python3 scripts/sync_drugs_from_vetvoice.py --check || {
            echo "::error::Копии базы разошлись с каноном vetvoice — прогоните scripts/sync_drugs_from_vetvoice.py"
            exit 1
          }
